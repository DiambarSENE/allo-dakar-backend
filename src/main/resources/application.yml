spring:
  application:
    name: allo-dakar-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    time-zone: Africa/Dakar
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # spring.security.oauth2.resourceserver.jwt.* est défini par profil (dev/prod : issuer-uri
  # avec auto-découverte de la JWK Set ; test : jwk-set-uri statique pour éviter un appel réseau
  # bloquant à Keycloak au démarrage du contexte de test — voir application-test.yml).

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  business:
    driver-verification-required-to-publish: true
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:allo-dakar}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:allo-dakar-backend-admin}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:tliknhhBRHsw3vPaI7h3TRWrbG0YRkCa53rp21NVivOH8nsjY1qJmCkSV8o6Lczp7FN00eMnB5TUyVHLHm8dZR}


springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
